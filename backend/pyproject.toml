[project]
name = "ai-mfg-copilot"
version = "1.0.0"
description = "AI Copilot for Manufacturing Process Planning and Quality Inspection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1; platform_system != 'Windows' or python_version >= '3.12'",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "bcrypt>=4.1",
    "PyJWT>=2.8",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S104", "B008", "E501", "UP042"]  # UP042: (str, Enum) kept instead of StrEnum for pre-3.11 tool compat

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_implicit_optional = true
